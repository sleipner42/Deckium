name: Build and Deploy to Azure Blob Storage

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build application
        working-directory: app
        run: npm run make

      - name: Upload to Azure Blob Storage
        run: |
          az storage blob upload-batch \
            --destination 'releases' \
            --source app/out \
            --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }} \
            --account-key ${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }} \
            --overwrite true

  build-multiplatform:
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: darwin
          - os: windows-latest  
            platform: win32
          - os: ubuntu-latest
            platform: linux
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build application
        working-directory: app
        run: npm run make

      - name: Upload to Azure Blob Storage
        run: |
          az storage blob upload-batch \
            --destination 'releases' \
            --destination-path '${{ matrix.platform }}' \
            --source app/out \
            --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }} \
            --account-key ${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }} \
            --overwrite true 